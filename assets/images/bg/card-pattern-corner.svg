<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Smooth theme red gradient fading towards top-left -->
    <linearGradient id="redGlowFade" x1="220" y1="220" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF014F" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#FF014F" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FF014F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF014F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redAccentFade" x1="220" y1="220" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF494A" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#FF014F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF014F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cornerAmbient" cx="220" cy="220" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF014F" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FF014F" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF014F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient corner glow -->
  <rect x="0" y="0" width="220" height="220" fill="url(#cornerAmbient)"/>

  <!-- Concentric Cyber Arcs radiating from bottom-right (220, 220) -->
  <path d="M 220 185 A 35 35 0 0 0 185 220" stroke="url(#redAccentFade)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 220 155 A 65 65 0 0 0 155 220" stroke="url(#redGlowFade)" stroke-width="1.4" stroke-dasharray="3 4"/>
  <path d="M 220 125 A 95 95 0 0 0 125 220" stroke="url(#redGlowFade)" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 220 95 A 125 125 0 0 0 95 220" stroke="url(#redGlowFade)" stroke-width="1.1" stroke-dasharray="5 6"/>
  <path d="M 220 65 A 155 155 0 0 0 65 220" stroke="url(#redGlowFade)" stroke-width="1" stroke-linecap="round"/>
  <path d="M 220 35 A 185 185 0 0 0 35 220" stroke="url(#redGlowFade)" stroke-width="0.8" stroke-dasharray="6 8"/>

  <!-- Angled Modern Tech Lines (45-degree chamfers and circuit traces) -->
  <path d="M 220 100 L 160 160 L 160 220" stroke="url(#redAccentFade)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 220 50 L 110 160 L 110 220" stroke="url(#redGlowFade)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 190 220 L 190 180 L 220 150" stroke="url(#redAccentFade)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tech Dots / Nodes -->
  <circle cx="160" cy="160" r="3" fill="#FF014F" opacity="0.75"/>
  <circle cx="110" cy="160" r="2.2" fill="#FF014F" opacity="0.5"/>
  <circle cx="190" cy="180" r="2.5" fill="#FF494A" opacity="0.75"/>
  <circle cx="155" cy="220" r="2.2" fill="#FF014F" opacity="0.6"/>
  <circle cx="220" cy="155" r="2.2" fill="#FF014F" opacity="0.6"/>
  <circle cx="125" cy="220" r="1.8" fill="#FF014F" opacity="0.5"/>
  <circle cx="220" cy="125" r="1.8" fill="#FF014F" opacity="0.5"/>

  <!-- Diagonal Tech Tick Marks -->
  <line x1="200" y1="20" x2="208" y2="28" stroke="#FF014F" stroke-width="1.2" opacity="0.4"/>
  <line x1="180" y1="40" x2="188" y2="48" stroke="#FF014F" stroke-width="1.2" opacity="0.4"/>
  <line x1="160" y1="60" x2="168" y2="68" stroke="#FF014F" stroke-width="1.2" opacity="0.4"/>
</svg>
